services:
  db:
    image: postgres:16-alpine
    container_name: location-scouting-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: location_scouting
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data


#  db-test:
#    image: postgres:16-alpine
#    container_name: location-scouting-db-test
#    restart: unless-stopped
#    environment:
#      POSTGRES_USER: postgres
#      POSTGRES_PASSWORD: postgres
#      POSTGRES_DB: location_scouting_test
#    ports:
#      - "5434:5432"

  # S3-compatible object storage for photos. See garage/garage.toml.
  # On first start it creates the app's access key and bucket from the OBJECT_STORE_* values in .env.
  garage:
    image: dxflrs/garage:v2.4.1
    container_name: location-scouting-garage
    restart: unless-stopped
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-8c4d0e2f6a1b3c5d7e9f0a2b4c6d8e0f1a3b5c7d9e1f3a5b7c9d1e3f5a7b9c1d}
      GARAGE_DEFAULT_ACCESS_KEY: ${OBJECT_STORE_ACCESS_KEY_ID:-GKlocaldevaccesskey}
      GARAGE_DEFAULT_SECRET_KEY: ${OBJECT_STORE_SECRET_ACCESS_KEY:-local-dev-secret-change-me}
      GARAGE_DEFAULT_BUCKET: ${OBJECT_STORE_BUCKET:-location-photos}
    ports:
      - "3900:3900"
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage_data:/var/lib/garage

  keyword-generation:
    build: ./keyword-generation
    container_name: keyword-generation
    restart: unless-stopped
    ports:
      - "8080:8080"

  # Stand-in for the external services (Google Vision, keyword generation, Nominatim) so the app and E2E tests
  # can run without API keys or network access. Opt-in; see mocks/README.md:
  #   docker compose --profile mocks up -d external-mocks
  external-mocks:
    image: wiremock/wiremock:3.13.1
    container_name: location-scouting-external-mocks
    profiles: ["mocks"]
    restart: unless-stopped
    command: ["--disable-banner"]
    ports:
      - "8089:8080"
    volumes:
      - ./mocks/wiremock:/home/wiremock


volumes:
  postgres_data:
#  postgres_test_data:
  garage_data: